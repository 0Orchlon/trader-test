# PERSONAL-3 · DEV дэд бүтэц (Postgres + Redis).
# Backend/frontend процесс тусад нь ажиллана (runbook.md §0) — энд зөвхөн
# offline cache-гүй, Docker Hub public image-ээр татагддаг дэд бүтэц.
# Порт: 8090/5181 (Hefesto) болон бусад локал төслүүдийн 15432/18080-той
# мөргөлдөхгүйгээр сонгосон.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: p3
      POSTGRES_PASSWORD: p3
      POSTGRES_DB: p3
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p3 -d p3"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Backend python орчны offline cache дутуу тул frontend-ийн статик
  # `dist/`-ийг л энд serve хийнэ (`npm run build` урьдчилж хийгдсэн байх ёстой).
  frontend:
    image: nginx:alpine
    ports:
      - "18080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
