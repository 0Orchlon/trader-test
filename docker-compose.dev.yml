# PERSONAL-3 · DEV дэд бүтэц (Postgres + Redis).
# Backend/frontend процесс тусад нь ажиллана (runbook.md §0) — энд зөвхөн
# offline cache-гүй, Docker Hub public image-ээр татагддаг дэд бүтэц.
# Порт: 8090/5181 (Hefesto) болон бусад локал төслүүдийн 15432/18080-той
# мөргөлдөхгүйгээр сонгосон.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: p3
      POSTGRES_PASSWORD: p3
      POSTGRES_DB: p3
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p3 -d p3"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Frontend-ийн статик (`npm run build` урьдчилж хийгдсэн байх ёстой) +
  # reverse proxy. Статикийг ДАНГААР нь serve хийхэд `/api/v1/*` ба
  # deep link 404 болж UI бүхэлдээ хоосон гарч байв (UAT U-1) — тиймээс
  # `ci/nginx.conf` нь `/api`, `/health`, `/ws`-ыг backend руу дамжуулж,
  # бусдыг `index.html` руу унагана.
  #
  # `BACKEND` нь backend ХААНА ажиллаж байгаа хаяг: анхдагчаар host дээрх
  # uvicorn (runbook §0). Контейнерт байршуулсан үед compose-ийн service
  # нэрээр (`BACKEND=backend:8000`) дарж бичнэ.
  frontend:
    image: nginx:alpine
    ports:
      - "18080:80"
    environment:
      BACKEND: ${BACKEND:-host.docker.internal:8000}
      # nginx-ийн `$host`, `$uri` зэргийг envsubst иддэг — зөвхөн BACKEND.
      NGINX_ENVSUBST_FILTER: BACKEND
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./ci/nginx.conf:/etc/nginx/templates/default.conf.template:ro
