# PERSONAL-3 · байршуулалтын nginx (U-1).
#
# Frontend нь `/api/v1/...` ба `/ws`-ыг НЭГ origin-оос дууддаг
# (`frontend/vite.config.ts`: «production-д reverse proxy энэ үүргийг
# гүйцэтгэнэ»). Тэр reverse proxy нь ЭНЭ файл — байхгүй үед байршуулсан UI
# 404 авч бүх дэлгэц хоосон гарна.
#
# `BACKEND` нь compose-ийн `frontend` service-д орчноос орлуулагдана
# (`envsubst`, nginx:alpine-ийн `/etc/nginx/templates/` механизм).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://${BACKEND};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Order илгээх зам нь Risk + broker-ийн дуудлагыг агуулна.
        proxy_read_timeout 120s;
    }

    # Байршуулалтын шалгах цэг. Backend нь ЗӨВХӨН `/api/v1/health`-ийг
    # үзүүлдэг тул зам солигдоно (O-2: өмнө нь энэ location нь backend дээр
    # байхгүй зам руу дамжуулж `404` авдаг байв). Location-ыг ерөөсөө
    # УСТГАХГҮЙ: тэгвэл `/health` нь SPA-ийн `index.html`-ийг `200`-аар
    # буцааж, monitor-д ХУДАЛ ногоон харагдана.
    location = /health {
        proxy_pass http://${BACKEND}/api/v1/health;
        proxy_set_header Host $host;
    }

    # WS нь kill switch / breaker-ийн мэдэгдлийн цорын ганц зам (AC-14) —
    # upgrade header дамжуулахгүй бол мэдэгдэл чимээгүй алга болно.
    location /ws {
        proxy_pass http://${BACKEND};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA deep link (`/approvals`, `/settings`) — файл байхгүй бол index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
